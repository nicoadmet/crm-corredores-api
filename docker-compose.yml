services:
  api:
    build:
      context: .
      args:
        DATABASE_URL: ${DATABASE_URL}
    # Pisa el CMD del Dockerfile (npm start) sólo para desarrollo: "npm run dev" usa tsx watch, así
    # el backend recarga solo al editar un archivo, igual que ya hacía el frontend. Sin esto el
    # proceso arranca una vez y nunca se entera de los cambios, aunque el volumen los sincronice.
    command: npm run dev
    ports:
      - "4000:4000"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules

  web:
    build:
      context: ../crm-corredores-web
    ports:
      - "5173:5173"
    env_file:
      - ../crm-corredores-web/.env
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ../crm-corredores-web:/app
      - /app/node_modules